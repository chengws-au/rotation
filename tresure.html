<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>坐標幾何尋寶大冒險</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px;
    font-family: "Microsoft JhengHei", sans-serif;
    background: #edf6ff; color: #19334c;
  }
  main {
    max-width: 850px; margin: auto; padding: 24px;
    background: white; border-radius: 22px;
    box-shadow: 0 8px 30px #183e6415;
  }
  h1 { text-align: center; margin: 0 0 12px; }
  .intro { text-align: center; color: #52687b; }
  .stats {
    display: flex; justify-content: center; flex-wrap: wrap;
    gap: 12px; margin: 18px 0;
  }
  .stats span {
    background: #eaf3ff; padding: 10px 16px; border-radius: 12px;
  }
  #question {
    background: #fff5d6; border-left: 6px solid #edb43b;
    padding: 18px; border-radius: 12px;
    font-size: 20px; font-weight: bold; line-height: 1.6;
  }
  canvas {
    display: block; width: 100%; max-width: 680px;
    margin: 16px auto; background: #fbfdff;
    border-radius: 12px; cursor: crosshair;
    touch-action: manipulation;
  }
  #feedback {
    min-height: 56px; padding: 12px; text-align: center;
    font-weight: bold; line-height: 1.6;
  }
  .controls {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
  }
  button {
    padding: 12px 18px; border: 0; border-radius: 10px;
    background: #2468c9; color: white; font-size: 16px;
    cursor: pointer;
  }
  button:hover { background: #184f9d; }
  button:disabled { opacity: .45; cursor: default; }
  .secondary { background: #587184; }
  .legend { text-align: center; font-size: 14px; color: #52687b; }
  details {
    margin-top: 20px; background: #f2f6fa;
    padding: 14px; border-radius: 10px; line-height: 1.8;
  }
  @media (max-width: 500px) {
    body { padding: 8px; }
    main { padding: 14px; }
    h1 { font-size: 24px; }
    #question { font-size: 18px; }
  }
</style>
</head>
<body>
<main>
  <h1>🗺️ 坐標幾何尋寶大冒險</h1>
  <p class="intro">找出變換後的整數坐標，在網格交點點一下，發掘寶藏！</p>

  <div class="stats">
    <span>💰 得分：<b id="score">0</b></span>
    <span>🏆 已找到：<b id="found">0</b> 個寶藏</span>
    <span>📍 第 <b id="number">1</b> 題</span>
  </div>

  <div id="question"></div>
  <canvas id="grid" width="680" height="680"
    aria-label="由負8至8的直角坐標平面，請點選答案位置"></canvas>
  <p class="legend">🔵 藍點：原來位置　🔴 紅點：上次錯誤位置　🟢 綠點：寶藏位置</p>

  <div id="feedback" role="status" aria-live="polite"></div>
  <div class="controls">
    <button id="next" disabled>下一個寶藏 →</button>
    <button id="hint" class="secondary">💡 查看提示</button>
    <button id="sound" class="secondary">🔊 音效：開</button>
    <button id="reset" class="secondary">重新開始</button>
  </div>

  <details>
    <summary>📖 變換小貼士</summary>
    對 x 軸反射：(x, y) → (x, −y)<br>
    對 y 軸反射：(x, y) → (−x, y)<br>
    平移：左右改變 x，上下改變 y。<br>
    繞原點順時針旋轉 90°：(x, y) → (y, −x)<br>
    繞原點逆時針旋轉 90°：(x, y) → (−y, x)<br>
    每題起始 10 分；每次答錯或首次查看提示扣 2 分，
    答對最少獲得 2 分。
  </details>
</main>

<script>
"use strict";

const $ = id => document.getElementById(id);
const canvas = $("grid");
const ctx = canvas.getContext("2d");
const padding = 52;
const step = (canvas.width - padding * 2) / 16;

let score = 0, found = 0, number = 0;
let question, solved = false, mistakes = 0, hinted = false;
let selected = null, soundEnabled = true, audioContext = null;

const random = (min, max) =>
  Math.floor(Math.random() * (max - min + 1)) + min;
const pointText = (x, y) => `(${x}, ${y})`;
const pixelX = x => padding + (x + 8) * step;
const pixelY = y => padding + (8 - y) * step;

function updateStats() {
  $("score").textContent = score;
  $("found").textContent = found;
  $("number").textContent = number;
}

function newQuestion() {
  const type = random(0, 4);
  let x, y;
  // 排除軸線上的原點，使反射和旋轉的效果更明顯。
  do { x = random(-6, 6); } while (x === 0);
  do { y = random(-6, 6); } while (y === 0);

  let ax, ay, text, hint;

  if (type === 0) {
    ax = x; ay = -y;
    text = `點 ${pointText(x, y)} 對 x 軸反射後的位置在哪裡？`;
    hint = "對 x 軸反射：x 不變，y 的正負號相反。";
  } else if (type === 1) {
    ax = -x; ay = y;
    text = `點 ${pointText(x, y)} 對 y 軸反射後的位置在哪裡？`;
    hint = "對 y 軸反射：y 不變，x 的正負號相反。";
  } else if (type === 2) {
    let dx, dy;
    // 確保平移後的答案仍在 −8 至 8 之內。
    do {
      dx = random(-5, 5);
      dy = random(-5, 5);
    } while (
      dx === 0 || dy === 0 ||
      Math.abs(x + dx) > 8 || Math.abs(y + dy) > 8
    );
    ax = x + dx; ay = y + dy;
    text = `點 ${pointText(x, y)} 向${dx > 0 ? "右" : "左"}平移
      ${Math.abs(dx)} 單位，再向${dy > 0 ? "上" : "下"}平移
      ${Math.abs(dy)} 單位後的位置在哪裡？`;
    hint = "向右：x 加；向左：x 減。向上：y 加；向下：y 減。";
  } else if (type === 3) {
    ax = y; ay = -x;
    text = `點 ${pointText(x, y)} 繞原點順時針旋轉 90° 後的位置在哪裡？`;
    hint = "順時針 90°：(x, y) → (y, −x)。";
  } else {
    ax = -y; ay = x;
    text = `點 ${pointText(x, y)} 繞原點逆時針旋轉 90° 後的位置在哪裡？`;
    hint = "逆時針 90°：(x, y) → (−y, x)。";
  }

  question = { x, y, ax, ay, text, hint };
  number++;
  solved = false;
  mistakes = 0;
  hinted = false;
  selected = null;
  $("question").textContent = text;
  $("feedback").textContent = "準備好了嗎？點選寶藏所在的坐標！";
  $("feedback").style.color = "#19334c";
  $("next").disabled = true;
  $("hint").disabled = false;
  updateStats();
  draw();
}

function drawPoint(x, y, color, label) {
  const px = pixelX(x), py = pixelY(y);
  ctx.beginPath();
  ctx.arc(px, py, 8, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.strokeStyle = "white";
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.font = 'bold 15px "Microsoft JhengHei", sans-serif';
  ctx.textAlign = x > 4 ? "right" : "left";
  ctx.textBaseline = y > 6 ? "top" : "bottom";
  ctx.fillStyle = color;
  ctx.fillText(label, px + (x > 4 ? -12 : 12),
    py + (y > 6 ? 12 : -12));
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 網格。
  ctx.lineWidth = 1;
  ctx.strokeStyle = "#cbd9e7";
  for (let i = -8; i <= 8; i++) {
    ctx.beginPath();
    ctx.moveTo(pixelX(i), pixelY(-8));
    ctx.lineTo(pixelX(i), pixelY(8));
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(pixelX(-8), pixelY(i));
    ctx.lineTo(pixelX(8), pixelY(i));
    ctx.stroke();
  }

  // 坐標軸及正方向箭嘴。
  ctx.strokeStyle = "#19334c";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(padding - 12, pixelY(0));
  ctx.lineTo(canvas.width - padding + 20, pixelY(0));
  ctx.moveTo(pixelX(0), canvas.height - padding + 12);
  ctx.lineTo(pixelX(0), padding - 20);
  ctx.stroke();

  ctx.fillStyle = "#19334c";
  ctx.beginPath();
  ctx.moveTo(canvas.width - padding + 20, pixelY(0));
  ctx.lineTo(canvas.width - padding + 9, pixelY(0) - 6);
  ctx.lineTo(canvas.width - padding + 9, pixelY(0) + 6);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(pixelX(0), padding - 20);
  ctx.lineTo(pixelX(0) - 6, padding - 9);
  ctx.lineTo(pixelX(0) + 6, padding - 9);
  ctx.closePath();
  ctx.fill();

  // 刻度及標籤。
  ctx.font = "14px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "top";
  for (let i = -8; i <= 8; i++) {
    if (i !== 0) ctx.fillText(i, pixelX(i), pixelY(0) + 10);
  }
  ctx.textAlign = "right";
  ctx.textBaseline = "middle";
  for (let i = -8; i <= 8; i++) {
    if (i !== 0) ctx.fillText(i, pixelX(0) - 12, pixelY(i));
  }
  ctx.fillText("0", pixelX(0) - 12, pixelY(0) + 18);
  ctx.font = "bold 20px sans-serif";
  ctx.fillText("x", canvas.width - 12, pixelY(0) - 18);
  ctx.fillText("y", pixelX(0) + 25, 22);

  drawPoint(question.x, question.y, "#2468c9",
    `P ${pointText(question.x, question.y)}`);

  if (selected && !solved) {
    drawPoint(selected.x, selected.y, "#d94b48",
      pointText(selected.x, selected.y));
  }
  if (solved) {
    drawPoint(question.ax, question.ay, "#14804a",
      `寶藏 ${pointText(question.ax, question.ay)}`);
  }
}

function successSound() {
  if (!soundEnabled) return;
  try {
    const Audio = window.AudioContext || window.webkitAudioContext;
    if (!Audio) return;
    audioContext = audioContext || new Audio();
    audioContext.resume().catch(() => {});
    const start = audioContext.currentTime;
    [523.25, 659.25, 783.99, 1046.5].forEach((frequency, i) => {
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      const t = start + i * 0.12;
      oscillator.type = "sine";
      oscillator.frequency.value = frequency;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.16, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
      oscillator.connect(gain);
      gain.connect(audioContext.destination);
      oscillator.start(t);
      oscillator.stop(t + 0.23);
    });
  } catch (error) {
    // 瀏覽器不支援音效時，仍可正常遊玩。
  }
}

canvas.addEventListener("click", event => {
  if (solved) return;

  // CSS 縮放後仍能正確換算點擊位置。
  const rect = canvas.getBoundingClientRect();
  const px = (event.clientX - rect.left) * canvas.width / rect.width;
  const py = (event.clientY - rect.top) * canvas.height / rect.height;

  if (px < padding || px > canvas.width - padding ||
      py < padding || py > canvas.height - padding) return;

  const x = Math.round((px - padding) / step - 8);
  const y = Math.round(8 - (py - padding) / step);
  selected = { x, y };

  if (x === question.ax && y === question.ay) {
    solved = true;
    const earned = Math.max(2, 10 - mistakes * 2 - (hinted ? 2 : 0));
    score += earned;
    found++;
    $("feedback").textContent =
      `🎉 找到寶藏！正確坐標是 ${pointText(x, y)}，獲得 ${earned} 分！`;
    $("feedback").style.color = "#14804a";
    $("next").disabled = false;
    $("hint").disabled = true;
    updateStats();
    successSound();
  } else {
    mistakes++;
    const wrongX = x !== question.ax;
    const wrongY = y !== question.ay;
    const tip = wrongX && wrongY
      ? "X 和 Y 坐標都算錯囉！"
      : wrongX
        ? "X 坐標算錯囉！Y 坐標正確。"
        : "Y 坐標算錯囉！X 坐標正確。";
    $("feedback").textContent =
      `你選了 ${pointText(x, y)}。${tip} 再試一次！`;
    $("feedback").style.color = "#b33b34";
  }
  draw();
});

$("next").addEventListener("click", newQuestion);

$("hint").addEventListener("click", () => {
  if (solved) return;
  hinted = true;
  $("feedback").textContent = "💡 " + question.hint;
  $("feedback").style.color = "#795a15";
});

$("sound").addEventListener("click", () => {
  soundEnabled = !soundEnabled;
  $("sound").textContent = soundEnabled ? "🔊 音效：開" : "🔇 音效：關";
});

$("reset").addEventListener("click", () => {
  score = 0;
  found = 0;
  number = 0;
  newQuestion();
});

newQuestion();
</script>
</body>
</html>
